name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check Astro
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Run browser and accessibility tests
        run: pnpm test:e2e

      - name: Type-check client dashboard
        run: pnpm --dir dashboard check

      - name: Run dashboard unit tests
        run: pnpm --dir dashboard test

      - name: Build client dashboard Worker
        run: pnpm --dir dashboard build

      - name: Run dashboard browser tests
        run: pnpm --dir dashboard test:e2e

      - name: Type-check photographer site
        run: pnpm --dir photographer-site check

      - name: Run photographer site unit tests
        run: pnpm --dir photographer-site test

      - name: Build photographer site
        run: pnpm --dir photographer-site build

      - name: Run photographer site browser tests
        run: pnpm --dir photographer-site test:e2e
