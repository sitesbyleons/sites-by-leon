name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: leon_platform_test
          POSTGRES_USER: leon_test
          POSTGRES_PASSWORD: leon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username leon_test --dbname leon_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://leon_test:leon_test@127.0.0.1:5432/leon_platform_test
      PROVISIONING_DATABASE_URL: postgresql://leon_test:leon_test@127.0.0.1:5432/leon_platform_test

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize integration database
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import postgres from 'postgres';
          const sql = postgres(process.env.PROVISIONING_DATABASE_URL, { max: 1 });
          await sql.unsafe(fs.readFileSync('infra/ovh/postgres/schema.sql', 'utf8'));
          await sql.end({ timeout: 5 });"

      - name: Run deployment preflight regressions
        run: |
          bash infra/ovh/tests/preflight-domain-worker.test.sh
          bash infra/ovh/tests/healthcheck-domain-worker.test.sh
          bash infra/ovh/tests/sync-secrets.test.sh
          bash infra/ovh/tests/backup-restore.test.sh
          bash infra/ovh/tests/monitor-production.test.sh
          bash infra/ovh/tests/switch-public-site-mode.test.sh

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check Astro
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Run browser and accessibility tests
        run: pnpm test:e2e

      - name: Type-check client dashboard
        run: pnpm --dir dashboard check

      - name: Run dashboard unit tests
        run: pnpm --dir dashboard test

      - name: Build client dashboard Worker
        run: pnpm --dir dashboard build

      - name: Run dashboard browser tests
        run: pnpm --dir dashboard test:e2e

      - name: Type-check custom-domain worker
        run: pnpm --dir domain-worker check

      - name: Run custom-domain worker tests
        run: pnpm --dir domain-worker test

      - name: Build custom-domain worker
        run: pnpm --dir domain-worker build

      - name: Validate the production database migration
        env:
          BASE_SCHEMA_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${BASE_SCHEMA_REF}" =~ ^0{40}$ ]]; then
            echo 'No previous commit exists; migration compatibility validation is not applicable.'
            exit 0
          fi
          bash infra/ovh/tests/validate-migration-ci.sh infra/ovh/scripts/validate-migration.sh

      - name: Type-check photographer site
        run: pnpm --dir photographer-site check

      - name: Run photographer site unit tests
        run: pnpm --dir photographer-site test

      - name: Build photographer site
        run: pnpm --dir photographer-site build

      - name: Run photographer site browser tests
        run: pnpm --dir photographer-site test:e2e

  trusted-csp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dashboard production CSP tests
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm --dir dashboard test:csp

      - name: Run photographer production CSP tests
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm --dir photographer-site test:csp
